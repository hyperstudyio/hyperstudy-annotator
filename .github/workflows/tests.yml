# Tests on every pull request and on main. Linux runners only (the repository is private, and macOS minutes cost ten
# times as much). No study media, bundles or secrets: browser tests that need the bake-off data skip themselves, and
# the Rust end-to-end test against the real pipeline runs only where PERCEPTION_REPO is set.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (svelte-check, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vitest run

  browser:
    name: Browser (Playwright in Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Google Chrome is preinstalled on GitHub's Ubuntu runners (playwright.config.ts uses channel: chrome); the
      # config starts the Vite dev server.
      - run: npx playwright test --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
      # Tests needing the bake-off data skip themselves here; a job that ran none would pass while checking nothing.
      - name: Some browser tests ran
        run: |
          ran=$(jq '.stats.expected + .stats.unexpected + .stats.flaky' playwright-results.json)
          echo "browser tests run: $ran"
          test "$ran" -gt 0

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The packages apt downloads (77 MB), kept between runs: the Ubuntu mirror's speed varies by the run (10.7 MB/s,
      # or 451 kB/s), so a run downloads only what changed since (ci-apt.sh). apt checks each kept package against the
      # signed lists it fetches, so one that differs is downloaded again. Keyed on the runner image, which changes weekly.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives/*.deb
          key: apt-tauri-libs-${{ env.ImageOS }}-${{ env.ImageVersion }}
          restore-keys: apt-tauri-libs-${{ env.ImageOS }}-
      # about 40 s with the packages kept, a few minutes without on a slow mirror; a stall fails here, its log saying
      # where (ci-apt.sh), not at the job's 30 minutes
      - name: Tauri's Linux libraries
        timeout-minutes: 5
        run: APT_ARCHIVES="$HOME/apt-archives" bash scripts/ci-apt.sh libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # tauri-build checks bundle.externalBin, so the bundled uv must be there before anything compiles (and this
      # checks the sha256 pinned for x86_64-unknown-linux-gnu)
      - run: bash scripts/fetch-uv.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
