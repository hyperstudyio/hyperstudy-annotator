name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    # Fork and bot pull requests get no repository secrets, so the action could not authenticate: skip them rather
    # than show a red X that only means "no credential".
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # A review that cannot authenticate must fail, not pass with nothing reviewed.
      - name: Refuse to review without a credential
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
            echo "Generate one with \`claude setup-token\` and add it as a repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # No git credentials left on disk: nothing a prompt could get posted as a comment.
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          # A Claude plan credential (claude setup-token), so reviews use plan usage rather than API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out. Read docs/PORT_PLAN.md and
            docs/BACKEND_PLAN.md before judging the diff: decisions are recorded beside the code that
            implements them, and most real defects here undo one of them rather than being ordinary bugs.

            This is a Tauri 2 desktop app (Rust in src-tauri/, Svelte 5 runes in src/) that views and
            corrects perception track bundles. Weight your attention in this order:

            1. **Nothing that must not leave the lab.** Study videos, frames and face crops are often
               copyrighted or identifiable; keys and tokens are secrets. None may appear in code, fixtures,
               tests or docs. Flag the FILE and say a human must check it; never quote a suspected secret.

            2. **Bundle paths are untrusted input.** Every path a bundle names is resolved through
               `bundle::safe_path` (relative components only, no symlink out of the bundle) before it is read,
               copied or served. Import rejects incomplete manifest entries and links. A Tauri command that
               reads a caller-supplied path outside the library is a defect.

            3. **The bundle is never modified; corrections are an append-only op log.** The viewer shows
               bundle + ops. The op format is a wire format: ops already stored or exported must keep loading
               (unknown fields degrade, old shapes are converted on import), and nothing rewrites history
               except an explicit undo (truncate) or import (replace).

            4. **SQLite migrations** in `src-tauri/src/db.rs` are append-only and numbered: a new one takes the
               next free version and is appended, never edited in place.

            5. **Timeline layout.** The timeline's scale is fitted to its width, so that width must never
               depend on what is on screen (grid tracks `minmax(0, ...)`, items `min-width: 0`;
               `e2e/timeline.spec.ts`).

            6. **Svelte 5 runes and accessibility.** `$state`/`$derived`/`$effect` rather than legacy stores
               and `on:` directives; interactive elements are keyboard reachable and labelled; no `:global()`
               on generic class names.

            7. **House rules.** Root cause over workarounds: no retries, sleeps or silent fallbacks. Every bug
               fix ships with a test that fails before it (vitest, Playwright or `cargo test`).

            Report findings as `file:line — summary` with a concrete failure scenario: specific inputs or
            state leading to a wrong outcome. Rank most severe first and label each MAJOR / MEDIUM / MINOR.
            If nothing survives scrutiny, say so plainly rather than inventing findings.

            Use `gh pr comment` for top-level feedback and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific code
            issues. Only post GitHub comments; do not return review text as a message. A review that is not
            posted did not happen.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
